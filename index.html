<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>치약 히어로 — 내 얼굴로 변신</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--blue:#3182f6;--blue-d:#1b64da;--g900:#191f28;--g700:#4e5968;--g500:#8b95a1;--g200:#e5e8eb;--g100:#f2f4f6;--ok:#00c471}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
  html,body{height:100%;background:#fff;color:var(--g900);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 56px) 24px calc(env(safe-area-inset-bottom) + 20px);transition:opacity .35s,transform .35s}
  .screen.off{opacity:0;pointer-events:none;transform:translateY(12px)}
  h1{font-size:26px;line-height:1.38;font-weight:700;letter-spacing:-.6px}
  .sub{margin-top:10px;font-size:17px;color:var(--g700);line-height:1.5;letter-spacing:-.3px;min-height:26px;transition:color .2s}
  .sub.ok{color:var(--blue)}
  .cta{width:100%;height:56px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:transform .1s,background .2s}
  .cta:active{transform:scale(.97);background:var(--blue-d)}
  .ghost{margin-top:8px;width:100%;height:48px;border:0;background:none;color:var(--g500);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
  .hero{display:flex;justify-content:center;align-items:center;flex:1}
  .hero-ball{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9ffd2 0,#4cf06b 30%,#1fc243 75%,#119a30 100%);position:relative;box-shadow:0 30px 60px -20px #1fc24366;animation:bob 2.4s ease-in-out infinite}
  .hero-ball::before,.hero-ball::after{content:"";position:absolute;top:42%;width:12px;height:12px;border-radius:50%;background:#16351d}
  .hero-ball::before{left:36%}.hero-ball::after{right:36%}
  @keyframes bob{50%{transform:translateY(-10px)}}
  .chips{display:flex;gap:8px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
  .chip{background:var(--g100);color:var(--g700);font-size:13px;font-weight:500;padding:7px 12px;border-radius:99px}
  .scan-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .scan{position:relative;width:min(84vw,340px);aspect-ratio:3/4;max-height:100%}
  .scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#fff}
  .scan svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .guide{fill:none;stroke:var(--g200);stroke-width:5}
  .prog{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke .2s}
  .prog.done{stroke:var(--ok)}
  .check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:all .3s cubic-bezier(.2,1.4,.4,1)}
  .check.on{opacity:1;transform:scale(1)}
  .check div{width:84px;height:84px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px #00c47155}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--g500);font-size:15px}
  .spin{width:28px;height:28px;border:3px solid var(--g200);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tip{text-align:center;color:var(--g500);font-size:14px;margin-top:8px}
  .back{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;width:44px;height:44px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #play{background:#000;padding:0;align-items:center;justify-content:center}
  #out{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:contain;display:block}
  .exit{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;height:38px;padding:0 16px;border-radius:99px;border:1px solid #ffffff40;background:#ffffff2e;color:#fff;font:inherit;font-size:15px;font-weight:600;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;z-index:5}
  .exit:active{background:#ffffff4d}
  .sound{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);height:40px;padding:0 18px;border-radius:99px;border:0;background:#ffffffe6;color:var(--g900);font:inherit;font-weight:600;font-size:15px;display:none;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,10px);background:#191f28e6;color:#fff;font-size:15px;padding:12px 18px;border-radius:14px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:9}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  input[type=file]{display:none}
</style>
</head>
<body>

<section class="screen" id="intro">
  <h1>내 얼굴로<br>치약 히어로가 되어볼까요?</h1>
  <p class="sub">얼굴을 인식하면 영상 속 초록 머리가<br>내 얼굴로 바뀌어요</p>
  <div class="hero"><div class="hero-ball"></div></div>
  <div class="chips"><span class="chip">📷 사진은 저장되지 않아요</span><span class="chip">🔒 폰 안에서만 처리</span></div>
  <button class="cta" id="start">시작하기</button>
  <button class="ghost" id="photoBtn">사진으로 할게요</button>
  <input type="file" id="file" accept="image/*">
</section>

<section class="screen off" id="scanScr">
  <button class="back" id="back" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#191f28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <h1>얼굴을 원 안에<br>맞춰주세요</h1>
  <p class="sub" id="msg">카메라를 준비하고 있어요</p>
  <div class="scan-wrap">
    <div class="scan" id="scanBox">
      <video id="camVid" playsinline muted autoplay></video>
      <svg viewBox="0 0 300 400" preserveAspectRatio="none">
        <path fill="#fff" fill-rule="evenodd" d="M-2-2H302V402H-2Z M150 55 a112 145 0 1 0 0.01 0Z"/>
        <ellipse class="guide" cx="150" cy="200" rx="112" ry="145"/>
        <ellipse class="prog" id="prog" cx="150" cy="200" rx="112" ry="145" pathLength="100" transform="rotate(-90 150 200)"/>
      </svg>
      <div class="loading" id="loading"><div class="spin"></div>얼굴 인식 준비 중</div>
      <div class="check" id="check"><div><svg width="44" height="44" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    </div>
  </div>
  <p class="tip">밝은 곳에서, 정면을 보고 2초간 유지해주세요</p>
</section>

<section class="screen off" id="play">
  <canvas id="out" width="720" height="1280"></canvas>
  <button class="exit" id="exit">나가기</button>
  <button class="sound" id="sound">🔊 소리 켜기</button>
</section>

<div class="toast" id="toast"></div>
<video id="vid" src="assets/hero.mp4" playsinline loop preload="auto" crossorigin="anonymous" style="display:none"></video>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "./lib/vision_bundle.mjs";
const $ = id => document.getElementById(id);
const vid = $('vid'), camVid = $('camVid'), out = $('out');
const HOLD_MS = 2000;

/* 화면 전환 */
function show(id){ ['intro','scanScr','play'].forEach(s => $(s).classList.toggle('off', s !== id));
  document.querySelector('meta[name=theme-color]').content = id === 'play' ? '#000000' : '#ffffff';
  document.body.style.background = id === 'play' ? '#000' : '#fff'; }
let toastT; function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2200); }

/* 초록 머리 추적 데이터 (영상 분석으로 미리 추출) */
let track = { fps: 24, frames: [] };
fetch('assets/track.json').then(r => r.json()).then(j => track = j);

/* 얼굴 누끼 텍스처 */
const FACE = 512;
const faceCan = document.createElement('canvas'); faceCan.width = faceCan.height = FACE;
const fctx = faceCan.getContext('2d', { willReadFrequently: true });
const maskCan = document.createElement('canvas'); maskCan.width = maskCan.height = FACE;
const mctx = maskCan.getContext('2d');
let skin = [0.85, 0.68, 0.58], faceW = 0.7, chinY = 0.98, hasFace = false, faceDirty = false;

let OVAL = null;
function ovalOrder(){
  if (OVAL) return OVAL;
  const conn = FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, next = {};
  conn.forEach(c => next[c.start] = c.end);
  const order = [conn[0].start]; let cur = next[conn[0].start];
  while (cur !== undefined && cur !== order[0] && order.length < 100){ order.push(cur); cur = next[cur]; }
  return OVAL = order;
}

// 랜드마크 윤곽으로 얼굴만 오려서 텍스처로
function captureFace(src, sw, sh, lm, mirror){
  const P = ovalOrder().map(i => [lm[i].x * sw, lm[i].y * sh]);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  P.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  const H = y1 - y0, ext = H * 0.06; y0 -= ext;              // 윤곽 맨 위가 이마 중간이라 살짝 위로
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, S = (y1 - y0) * 1.02;
  const tx = (x, y) => { const u = (x - cx) / S * FACE + FACE / 2, v = (y - cy) / S * FACE + FACE / 2; return [mirror ? FACE - u : u, v]; };
  const T = P.map(([x, y]) => { const k = Math.max(0, (cy - y) / (H / 2)); return tx(x, y - ext * k * k); });

  // 마스크: 윤곽 채우고 가장자리는 안쪽으로 부드럽게
  mctx.globalCompositeOperation = 'source-over'; mctx.clearRect(0, 0, FACE, FACE); mctx.fillStyle = '#fff';
  const path = new Path2D(); T.forEach(([u, v], i) => i ? path.lineTo(u, v) : path.moveTo(u, v)); path.closePath();
  mctx.fill(path);
  mctx.globalCompositeOperation = 'destination-out'; mctx.lineJoin = 'round'; mctx.strokeStyle = 'rgba(0,0,0,.16)';
  for (let w = 26; w >= 2; w -= 4){ mctx.lineWidth = w; mctx.stroke(path); }

  fctx.save(); fctx.globalCompositeOperation = 'source-over'; fctx.clearRect(0, 0, FACE, FACE);
  if (mirror){ fctx.translate(FACE, 0); fctx.scale(-1, 1); }
  const sc = FACE / S; fctx.translate(FACE / 2, FACE / 2); fctx.scale(sc, sc); fctx.translate(-cx, -cy);
  fctx.drawImage(src, 0, 0, sw, sh); fctx.restore();

  // 피부색 (양 볼, 이마, 턱 주변 평균) → 얼굴 바깥 머리 부분 채움
  let r = 0, g = 0, b = 0, n = 0;
  [50, 280, 151, 205, 425].map(i => tx(lm[i].x * sw, lm[i].y * sh)).forEach(([u, v]) => {
    const d = fctx.getImageData(Math.max(0, u - 6) | 0, Math.max(0, v - 6) | 0, 12, 12).data;
    for (let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; } });
  if (n) skin = [r / n / 255, g / n / 255, b / n / 255];

  fctx.globalCompositeOperation = 'destination-in'; fctx.drawImage(maskCan, 0, 0); fctx.globalCompositeOperation = 'source-over';
  faceW = (x1 - x0) / S; chinY = 0.5 + (y1 - cy) / S;
  hasFace = true; faceDirty = true;
}

/* WebGL 합성 */
const gl = out.getContext('webgl', { premultipliedAlpha: false });
const VS = `attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const FS = `precision highp float;varying vec2 uv;
uniform sampler2D tv,tf;uniform vec3 circ,skin;uniform float has,faceW,chinY;uniform vec2 res;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
  vec3 c=texture2D(tv,uv).rgb;
  if(circ.z<=0.||has<.5){gl_FragColor=vec4(c,1.);return;}
  vec2 px=uv*res;vec2 cp=circ.xy*res;float r=circ.z*res.x;
  float d=distance(px,cp)/r;
  float key=clamp((c.g-max(c.r,c.b)-.10)/.16,0.,1.);
  float dark=step(luma(c),.22)*step(c.b-c.r,.08)*(1.-smoothstep(.80,.88,d));
  float inS=1.-smoothstep(1.03,1.10,d);
  float g=inS*max(key,dark);              // 초록 머리 픽셀
  // 얼굴 자체를 머리로: 턱을 목 위치에, 얼굴 폭이 초록 머리 폭을 덮도록
  float k=(2.*r*1.14)/faceW;
  vec2 fuv=vec2(.5,chinY)+(px-vec2(cp.x,cp.y+r*.97))/k;
  vec4 f=texture2D(tf,clamp(fuv,0.,1.));
  f.a*=step(0.,fuv.x)*step(fuv.x,1.)*step(0.,fuv.y)*step(fuv.y,1.);
  // 초록 번짐 제거
  vec3 base=c;float near=1.-smoothstep(1.,1.25,d);
  base.g-=max(0.,c.g-max(c.r,c.b))*near*(1.-g)*.85;
  // 얼굴이 못 덮은 초록은 목 그림자처럼
  base=mix(base,skin*.55,g);
  // 머리 안쪽: 초록 위에만(팔·소품은 앞에), 머리 밖: 얼굴을 그대로 위에
  // 테두리 링: 팔(파랑)·몸(흰색)만 앞으로, 나머지(구 외곽선)는 얼굴로 덮기
  float arm=max(step(.12,c.b-c.r)*step(c.g,c.b),step(.72,min(c.r,min(c.g,c.b))));
  float inner=1.-smoothstep(.84,.92,d);
  float occ=mix(1.-arm,g,inner);
  float a=f.a*mix(1.,occ,inS);
  gl_FragColor=vec4(mix(base,f.rgb,a),1.);
}`;
function shd(t, s){ const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, shd(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shd(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
function mkTex(unit){ const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([k, v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); return t; }
const texV = mkTex(0), texF = mkTex(1);
const U = n => gl.getUniformLocation(prog, n);
gl.uniform1i(U('tv'), 0); gl.uniform1i(U('tf'), 1); gl.uniform2f(U('res'), 720, 1280);

let videoReady = false;
function render(t){
  if (!videoReady) return;
  gl.viewport(0, 0, 720, 1280);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texV);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, vid);
  if (faceDirty){ gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texF);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, faceCan); faceDirty = false; }
  const fr = track.frames, c = fr[Math.min(fr.length - 1, Math.max(0, Math.floor((t ?? vid.currentTime) * track.fps + 0.001)))];
  gl.uniform3f(U('circ'), c ? c[0] : 0, c ? c[1] : 0, c ? c[2] : 0);
  gl.uniform3f(U('skin'), skin[0], skin[1], skin[2]);
  gl.uniform1f(U('has'), hasFace ? 1 : 0); gl.uniform1f(U('faceW'), faceW); gl.uniform1f(U('chinY'), chinY);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
if ('requestVideoFrameCallback' in HTMLVideoElement.prototype){
  const loop = (now, m) => { render(m.mediaTime); vid.requestVideoFrameCallback(loop); }; vid.requestVideoFrameCallback(loop);
} else { const loop = () => { render(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
vid.addEventListener('loadeddata', () => { videoReady = true; render(0); });
vid.addEventListener('seeked', () => render());
vid.load();

/* 얼굴 인식 엔진 (MediaPipe Face Landmarker) */
let lmk = null, lmkMode = null, lmkLoading = null;
async function engine(mode){
  if (!lmk){
    lmkLoading ??= (async () => {
      const fs = await FilesetResolver.forVisionTasks(new URL('lib/wasm', location.href).href);
      const opt = d => ({ baseOptions: { modelAssetPath: 'assets/face_landmarker.task', delegate: d }, runningMode: mode, numFaces: 1, minFaceDetectionConfidence: 0.3, minFacePresenceConfidence: 0.3, minTrackingConfidence: 0.3 });
      try { lmk = await FaceLandmarker.createFromOptions(fs, opt('GPU')); } catch (e) { lmk = await FaceLandmarker.createFromOptions(fs, opt('CPU')); }
      lmkMode = mode;
    })();
    await lmkLoading;
  }
  if (lmkMode !== mode){ await lmk.setOptions({ runningMode: mode }); lmkMode = mode; }
  return lmk;
}
engine('VIDEO').catch(e => console.error(e));

/* iOS 소리 잠금 해제 */
let audioUnlocked = false;
function unlockAudio(){ if (audioUnlocked) return; audioUnlocked = true; vid.muted = false;
  const p = vid.play(); p && p.then(() => { if ($('play').classList.contains('off')){ vid.pause(); vid.currentTime = 0; } }).catch(() => {}); }

/* 카메라 스캔 */
let stream = null, raf = 0, hold = 0, badMs = 0, lastFrame = 0, goodLm = null, scanStart = 0, lastTs = 0, done = false;
const progEl = $('prog'), msg = $('msg');
function setMsg(t, ok){ if (msg.textContent !== t) msg.textContent = t; msg.classList.toggle('ok', !!ok); }
function setProg(p){ progEl.style.strokeDasharray = `${Math.max(0, Math.min(100, p * 100))} 100`; progEl.style.opacity = p > 0.005 ? 1 : 0; }

async function startScan(){
  show('scanScr'); done = false; hold = 0; badMs = 0; lastFrame = 0; goodLm = null; setProg(0);
  progEl.classList.remove('done'); $('check').classList.remove('on');
  setMsg('카메라를 준비하고 있어요');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false });
  } catch (e) { setMsg('카메라 권한을 허용해주세요'); toast('설정에서 카메라 권한을 켜주세요'); return; }
  camVid.srcObject = stream; await camVid.play().catch(() => {});
  await engine('VIDEO'); $('loading').style.display = 'none';
  scanStart = performance.now(); cancelAnimationFrame(raf); loop();
}
function stopScan(){ cancelAnimationFrame(raf); if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } camVid.srcObject = null; }

// 가이드 원(SVG 300x400 좌표)과 얼굴 위치 비교 → 문제 있으면 안내 문구
function check(lm){
  const box = $('scanBox').getBoundingClientRect(), vw = camVid.videoWidth, vh = camVid.videoHeight;
  const s = Math.max(box.width / vw, box.height / vh), ox = (box.width - vw * s) / 2, oy = (box.height - vh * s) / 2;
  const toSvg = p => [((ox + (1 - p.x) * vw * s) / box.width) * 300, ((oy + p.y * vh * s) / box.height) * 400];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  ovalOrder().forEach(i => { const [x, y] = toSvg(lm[i]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, h = y1 - y0;
  const nose = toSvg(lm[1])[0], L = toSvg(lm[234])[0], R = toSvg(lm[454])[0];
  const yaw = (nose - Math.min(L, R)) / Math.max(1, Math.abs(R - L));
  const roll = Math.abs(lm[33].y - lm[263].y) / Math.max(1e-3, Math.abs(lm[33].x - lm[263].x));
  const relax = scanStart && performance.now() - scanStart > 6000 ? 1.5 : 1; // 오래 걸리면 조건 완화
  if (h < 290 * 0.42 / relax) return '조금 더 가까이 와주세요';
  if (h > 290 * 1.25 * relax) return '조금만 뒤로 가주세요';
  if (Math.abs(cx - 150) > 55 * relax || Math.abs(cy - 200) > 70 * relax) return '얼굴을 원 가운데에 맞춰주세요';
  if (yaw < 0.22 / relax || yaw > 1 - 0.22 / relax || roll > 0.35 * relax) return '정면을 바라봐주세요';
  return null;
}
function loop(){
  raf = requestAnimationFrame(loop);
  if (done || !stream || camVid.readyState < 2 || !lmk) return;
  let ts = performance.now(); if (ts <= lastTs) ts = lastTs + 1; lastTs = ts;
  const res = lmk.detectForVideo(camVid, ts);
  const lm = res.faceLandmarks && res.faceLandmarks[0];
  const dt = Math.min(100, ts - (lastFrame || ts)); lastFrame = ts;
  const problem = lm ? check(lm) : '얼굴이 보이지 않아요';
  if (problem){
    badMs += dt;
    if (badMs > 350){ hold = Math.max(0, hold - dt * 1.5); setMsg(problem); }
  } else {
    badMs = 0; hold += dt; goodLm = lm;
    setMsg('좋아요! 그대로 유지해주세요', true);
  }
  const p = hold / HOLD_MS; setProg(p);
  if (p >= 1){
    done = true; progEl.classList.add('done'); $('check').classList.add('on'); setMsg('인식 완료!', true);
    navigator.vibrate && navigator.vibrate(40);
    captureFace(camVid, camVid.videoWidth, camVid.videoHeight, lm || goodLm, true);
    setTimeout(() => { stopScan(); startPlay(); }, 650);
  }
}

/* 영상 반복 재생 */
function startPlay(){
  show('play'); vid.loop = true; vid.currentTime = 0; vid.muted = false; $('sound').style.display = 'none';
  vid.play().catch(() => { vid.muted = true; vid.play(); $('sound').style.display = 'block'; });
}
$('sound').onclick = () => { vid.muted = false; vid.play(); $('sound').style.display = 'none'; };
$('exit').onclick = () => { vid.pause(); startScan(); };

/* 버튼 */
$('start').onclick = () => { unlockAudio(); startScan(); };
$('back').onclick = () => { stopScan(); show('intro'); };
$('photoBtn').onclick = () => { unlockAudio(); $('file').click(); };
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('얼굴을 찾고 있어요…');
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  const res = (await engine('IMAGE')).detect(img);
  const lm = res.faceLandmarks && res.faceLandmarks[0];
  if (!lm){ toast('사진에서 얼굴을 찾지 못했어요'); return; }
  captureFace(img, img.naturalWidth, img.naturalHeight, lm, false);
  startPlay();
});
</script>
